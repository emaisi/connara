name: Verify Connara
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 redis-server
      - name: Verify frontend and build embedded server
        run: npm --prefix web run check && ./scripts/build.sh
      - name: Verify isolated PostgreSQL and Redis integration
        env:
          APIHUB_TEST_PG_BIN: /usr/lib/postgresql/16/bin
        run: ./scripts/test-integration.sh
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: npm --prefix web audit --registry=https://registry.npmjs.org
